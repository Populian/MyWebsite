[build]
  publish = "public"

[functions]
  node_bundler = "esbuild"
  included_files = ["data.json"]

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
