<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule — Populian Faming Qin</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/home.html" class="nav-logo">Populian Faming Qin</a>
      <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links">
        <a href="/home.html">Home</a>
        <a href="/about.html">About</a>
        <a href="/works.html">Works</a>
        <a href="/portfolio.html">Portfolio</a>
        <a href="/research.html">Research</a>
        <a href="/schedule.html" class="active">Schedule</a>
        <a href="/contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <p class="section-label">Events</p>
    <h1 class="section-title">Schedule</h1>
    <p class="section-desc">Upcoming performances, premieres, and festival appearances.</p>
  </div>

  <div class="section section-after-header">
    <div class="timeline" id="timeline">
      <div class="loading">Loading schedule</div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-name">Populian Faming Qin</p>
      <p>&copy; 2026 Populian Faming Qin. All rights reserved.</p>
    </div>
  </footer>

  <script>
    async function loadSchedule() {
      try {
        const res = await fetch('/api/schedule');
        const events = await res.json();
        const timeline = document.getElementById('timeline');
        if (events.length === 0) {
          timeline.innerHTML = '<p class="empty-state">No upcoming events scheduled. Check back soon.</p>';
          return;
        }
        timeline.innerHTML = events.map(e => {
          const d = new Date(e.event_date || e.eventDate);
          const dateStr = d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          return `
            <div class="timeline-item">
              <div class="timeline-date">${dateStr}</div>
              <div>
                <div class="timeline-title">${e.title}</div>
                <div class="timeline-details">
                  ${e.venue ? `${e.venue}` : ''}${e.city_country || e.cityCountry ? ` — ${e.city_country || e.cityCountry}` : ''}
                  ${e.work_performed || e.workPerformed ? `<br>Performing: <em>${e.work_performed || e.workPerformed}</em>` : ''}
                </div>
                ${e.link ? `<a href="${e.link}" target="_blank" class="timeline-link">Event Details &rarr;</a>` : ''}
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        console.error('Failed to load schedule:', e);
        document.getElementById('timeline').innerHTML = '<p class="empty-state">Schedule not available. Check back soon.</p>';
      }
    }
    loadSchedule();
  </script>
</body>
</html>
