<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule — Populian Faming Qin</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/home.html" class="nav-logo">Populian Faming Qin</a>
      <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links">
        <a href="/home.html">Home</a>
        <a href="/about.html">About</a>
        <a href="/works.html">Works</a>
        <a href="/portfolio.html">Portfolio</a>
        <a href="/research.html">Research</a>
        <a href="/schedule.html" class="active">Schedule</a>
        <a href="/contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <p class="section-label">Events</p>
    <h1 class="section-title">Schedule</h1>
    <p class="section-desc">Upcoming performances, premieres, and festival appearances.</p>
  </div>

  <div class="section section-after-header">
    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:36px;align-items:center;">
      <div style="display:flex;gap:4px;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.06);border-radius:980px;padding:3px;">
        <button class="filter-btn active" id="schedToggleAll" style="padding:8px 18px;font-size:0.72rem;" onclick="setSchedFilter('all')">All Events</button>
        <button class="filter-btn" id="schedToggleUpcoming" style="padding:8px 18px;font-size:0.72rem;" onclick="setSchedFilter('upcoming')">Upcoming</button>
        <button class="filter-btn" id="schedTogglePast" style="padding:8px 18px;font-size:0.72rem;" onclick="setSchedFilter('past')">Past</button>
      </div>
    </div>
    <div class="timeline" id="timeline">
      <div class="loading">Loading schedule</div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-name">Populian Faming Qin</p>
      <p>&copy; 2026 Populian Faming Qin. All rights reserved.</p>
    </div>
  </footer>

  <script>
    var allEvents = [];
    var schedFilter = 'all';

    function formatDate(dateStr) {
      var d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    function getMonthKey(dateStr) {
      var d = new Date(dateStr);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    function getMonthLabel(dateStr) {
      var d = new Date(dateStr);
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
    }

    function isPast(dateStr) {
      var d = new Date(dateStr);
      var now = new Date();
      now.setHours(0, 0, 0, 0);
      return d < now;
    }

    function setSchedFilter(filter) {
      schedFilter = filter;
      document.querySelectorAll('#schedToggleAll, #schedToggleUpcoming, #schedTogglePast').forEach(function(b) {
        b.classList.remove('active');
      });
      var id = filter === 'all' ? 'schedToggleAll' : filter === 'upcoming' ? 'schedToggleUpcoming' : 'schedTogglePast';
      document.getElementById(id).classList.add('active');
      renderSchedule();
    }

    function renderSchedule() {
      var timeline = document.getElementById('timeline');
      var filtered = allEvents;
      if (schedFilter === 'upcoming') {
        filtered = allEvents.filter(function(e) { return !isPast(e.event_date || e.eventDate); });
      } else if (schedFilter === 'past') {
        filtered = allEvents.filter(function(e) { return isPast(e.event_date || e.eventDate); });
      }

      if (filtered.length === 0) {
        var msg = schedFilter === 'upcoming' ? 'No upcoming events scheduled.' : schedFilter === 'past' ? 'No past events recorded.' : 'No events scheduled.';
        timeline.innerHTML = '<p class="empty-state">' + msg + ' Check back soon.</p>';
        return;
      }

      // Group by month
      var groups = {};
      filtered.forEach(function(e) {
        var key = getMonthKey(e.event_date || e.eventDate);
        if (!groups[key]) groups[key] = [];
        groups[key].push(e);
      });

      var keys = Object.keys(groups).sort().reverse();
      var html = '';
      keys.forEach(function(key) {
        var events = groups[key].sort(function(a, b) {
          return String(b.event_date || b.eventDate || '').localeCompare(String(a.event_date || a.eventDate || ''));
        });
        var label = getMonthLabel(events[0].event_date || events[0].eventDate);
        html += '<div class="timeline-month"><span>' + label + '</span></div>';
        events.forEach(function(e) {
          var dateStr = formatDate(e.event_date || e.eventDate);
          var isPastEvent = isPast(e.event_date || e.eventDate);
          html += '<div class="timeline-item' + (isPastEvent ? ' timeline-item--past' : '') + '">';
          html += '<div class="timeline-date">';
          html += '<span class="timeline-date-badge">' + dateStr + '</span>';
          html += '</div>';
          html += '<div class="timeline-content">';
          html += '<div class="timeline-title">' + e.title + '</div>';
          html += '<div class="timeline-details">';
          if (e.venue) html += e.venue;
          if (e.city_country || e.cityCountry) {
            if (e.venue) html += ' — ';
            html += (e.city_country || e.cityCountry);
          }
          if (e.work_performed || e.workPerformed) {
            html += '<br>Performing: <em>' + (e.work_performed || e.workPerformed) + '</em>';
          }
          html += '</div>';
          if (e.link) html += '<a href="' + e.link + '" target="_blank" class="timeline-link">Event Details &rarr;</a>';
          html += '</div></div>';
        });
      });

      timeline.innerHTML = html;
    }

    async function loadSchedule() {
      try {
        const res = await fetch('/api/schedule');
        const events = await res.json();
        allEvents = Array.isArray(events) ? events : [];
        renderSchedule();
      } catch (e) {
        console.error('Failed to load schedule:', e);
        document.getElementById('timeline').innerHTML = '<p class="empty-state">Schedule not available. Check back soon.</p>';
      }
    }
    loadSchedule();
  </script>
</body>
</html>
