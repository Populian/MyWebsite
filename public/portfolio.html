<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Populian Faming Qin</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/home.html" class="nav-logo">Populian Faming Qin</a>
      <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links">
        <a href="/home.html">Home</a>
        <a href="/about.html">About</a>
        <a href="/works.html">Works</a>
        <a href="/portfolio.html" class="active">Portfolio</a>
        <a href="/research.html">Research</a>
        <a href="/schedule.html">Schedule</a>
        <a href="/contact.html">Contact</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <p class="section-label">Gallery</p>
    <h1 class="section-title">Portfolio</h1>
    <p class="section-desc">Concert photography, project documentation, and visual materials.</p>
  </div>

  <div class="section section-after-header">
    <div class="gallery-toolbar">
      <p id="galleryCount" class="gallery-count"></p>
    </div>
    <div class="gallery-grid" id="gallery">
      <div class="loading">Loading gallery</div>
    </div>
  </div>

  <div class="modal-overlay" id="lightbox">
    <div style="max-width:90vw;max-height:90vh;position:relative;">
      <button class="modal-close" onclick="closeLightbox()" style="position:fixed;top:20px;right:20px;z-index:10;">&times;</button>
      <img id="lightboxImg" style="max-width:90vw;max-height:85vh;object-fit:contain;border-radius:8px;">
    </div>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-name">Populian Faming Qin</p>
      <p>&copy; 2026 Populian Faming Qin. All rights reserved.</p>
    </div>
  </footer>

  <script>
    let allMedia = [];
    function renderGallery() {
      const grid = document.getElementById('gallery');
      const count = document.getElementById('galleryCount');
      count.textContent = allMedia.length ? allMedia.length + ' photos' : '';
      if (allMedia.length === 0) {
        grid.innerHTML = '<p class="empty-state">No images uploaded yet.</p>';
        return;
      }
      grid.innerHTML = allMedia.map(m => `
        <button class="gallery-item" onclick="openLightbox('${m.url}')" aria-label="Open ${m.originalName || 'photo'}">
          <img src="${m.url}" alt="${m.originalName || ''}" loading="lazy">
        </button>
      `).join('');
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }
    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) closeLightbox();
    });

    async function loadGallery() {
      try {
        const res = await fetch('/api/media');
        allMedia = await res.json();
        renderGallery();
      } catch (e) {
        console.error('Failed to load gallery:', e);
        document.getElementById('gallery').innerHTML = '<p class="empty-state">Gallery is temporarily unavailable.</p>';
      }
    }
    loadGallery();
  </script>
</body>
</html>
